{% extends "base.html" %}
{% block content %}
<style>
    .scoreboard-container {
        max-width: 700px;
        margin: 40px auto;
    }

    .scoreboard-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .scoreboard-header i {
        font-size: 3rem;
        color: #f1c40f;
        margin-bottom: 1rem;
    }

    .scoreboard-header h2 {
        font-size: 2.2rem;
        color: var(--text-primary);
        font-weight: 700;
    }

    .scoreboard-header p {
        color: var(--text-secondary);
        font-size: 1.05rem;
        margin-top: 0.25rem;
    }

    .board-card {
        background: var(--white);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        padding: 2rem;
        border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .leaderboard-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 1rem 1.5rem;
        background: #f8fafc;
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    .leaderboard-item:hover {
        transform: scale(1.02);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .rank-badge {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        margin-right: 1.5rem;
        color: var(--text-primary);
    }

    .rank-1 {
        background: #f1c40f;
        color: white;
    }

    .rank-2 {
        background: #95a5a6;
        color: white;
    }

    .rank-3 {
        background: #d35400;
        color: white;
    }

    .rank-other {
        background: #e2e8f0;
    }

    .team-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-primary);
        flex-grow: 1;
    }

    .score-badge {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-color);
        background: rgba(52, 152, 219, 0.1);
        padding: 0.4rem 1.25rem;
        border-radius: 20px;
    }
</style>

<div class="scoreboard-container">
    <div class="scoreboard-header">
        <i class="fas fa-trophy"></i>
        <h2>Leaderboard Standings</h2>
        <p>Current team standings and overall score summaries</p>
    </div>

    <div class="board-card">
        <div class="leaderboard-list">
            {% for entry in scoreboard %}
            <div class="leaderboard-item">
                <div class="rank-badge {% if loop.index == 1 %}rank-1{% elif loop.index == 2 %}rank-2{% elif loop.index == 3 %}rank-3{% else %}rank-other{% endif %}">
                    {{ loop.index }}
                </div>
                <div class="team-name">{{ entry.team }}</div>
                <div class="score-badge">{{ entry.score }} pts</div>
            </div>
            {% else %}
            <p style="text-align: center; color: var(--text-secondary);">No scores have been recorded yet.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
