{% extends "base.html" %}
{% block content %}
<style>
    .profile-container {
        max-width: 650px;
        margin: 40px auto;
    }

    .profile-card {
        background: var(--white);
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0, 0, 0, 0.02);
        text-align: center;
    }

    .profile-picture-container {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 2rem;
        border-radius: 50%;
        padding: 6px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        box-shadow: 0 8px 24px rgba(52, 152, 219, 0.2);
    }

    .profile-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        border: 4px solid #fff;
    }

    .profile-name {
        font-size: 2rem;
        color: var(--text-primary);
        font-weight: 700;
        margin-bottom: 0.25rem;
    }

    .profile-badge {
        display: inline-block;
        padding: 0.35rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        background: rgba(46, 204, 113, 0.1);
        color: var(--secondary-color);
        margin-bottom: 2rem;
    }

    .profile-badge.organizer {
        background: rgba(231, 76, 60, 0.1);
        color: #e74c3c;
    }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        text-align: left;
        margin-top: 1rem;
        border-top: 2px solid #f8fafc;
        padding-top: 2rem;
    }

    .info-row {
        display: flex;
        align-items: center;
        padding: 0.85rem 1.25rem;
        background: #f8fafc;
        border-radius: 12px;
        gap: 1rem;
    }

    .info-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(52, 152, 219, 0.1);
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
    }

    .info-content {
        display: flex;
        flex-direction: column;
    }

    .info-label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .info-value {
        font-size: 1.05rem;
        color: var(--text-primary);
        font-weight: 600;
        margin-top: 0.15rem;
    }
</style>

<div class="profile-container">
    <div class="profile-card">
        <div class="profile-picture-container">
            <img class="profile-img" src="{{ url_for('static', filename=user.avatar) }}" alt="{{ user.name }}'s profile picture">
        </div>
        <h2 class="profile-name">{{ user.name }}</h2>
        <span class="profile-badge {{ 'organizer' if user.role == 'organizer' else '' }}">
            {{ user.role | capitalize }} Account
        </span>

        <div class="info-grid">
            <div class="info-row">
                <div class="info-icon">
                    <i class="fas fa-id-card"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">College ID</span>
                    <span class="info-value">{{ user.college_id }}</span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">Email Address</span>
                    <span class="info-value">{{ user.email }}</span>
                </div>
            </div>

            {% if user.role != 'organizer' %}
            <div class="info-row">
                <div class="info-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">Academic Major</span>
                    <span class="info-value">{{ user.major }}</span>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
